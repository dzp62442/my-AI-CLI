schema_version: 1
description: >-
  AI Agent 在主题筛选之后、论文解读之前，为原始日报中的每篇论文选取标签。
  标签仅填写到“主题筛选结果”表的五个标签列，原始日报和论文解读不附加标签。

selection_rules:
  - 标签服务于科研浏览与论文归类，沿用既定科研习惯，抓住论文主要特点即可，不要求穷尽细节或作过度严格的术语划分。
  - 先判断主题相关性，再标注标签；标签用于描述论文，不代替入选或未入选的判断。
  - 以论文自身的任务、输入、方法和实验为依据；摘要或 TLDR 不足时查阅原文，优先 HTML。
  - 区分本文方法与相关工作、对比基线、未来设想；后几者出现的术语不能直接作为本文标签。
  - 输入配置、平台和一般场景以方法实际使用或实验验证的设置为准；仅用于训练监督、生成真值或评测的设备不算推理输入。
  - options 的键是可选标签；含 / 的键保留为同一组，共用一段解释。填写表格时从组内选取适用的标签，不照抄整个组名。
  - 多选字段可以跨组或在同组内选择多个有依据的标签，去重后用“、”分隔；层级有重叠时优先具体标签，避免重复表达。
  - 信息不足写“未说明”，不把信息缺失写成“通用”或“其他”；其他仅表示已知类别不在列举范围内。
  - 其他的括号内容按各维度的字数限制简要概括；运行时的补充标签不自动写回此文件。

table:
  column_order: [research_area, sensors, platforms, scenarios, technical]
  multiple_separator: "、"
  unknown: "未说明"
  no_technical_tag: "—"

dimensions:
  research_area:
    column: 研究领域
    selection: single
    notes:
      - 只选一个最能代表主要研究任务与贡献的领域；多任务论文按主要问题和核心实验判断。
      - 沿用科研任务分类：前馈高斯和优化高斯分别指两类高斯重建任务，均属于三维重建大类，在本表中与 Occ、深度估计等任务并列。
      - 按论文主要研究的任务归类。高斯重建选前馈高斯或优化高斯，用高斯做占据预测选 Occ，用高斯实现定位建图选 SLAM。
      - 前馈方法附带可选的逐场景优化时，以主要方法及主要结果所对应的范式判断，不因可选优化同时选两个领域。
      - 重建任务优先选前馈高斯、优化高斯、前馈点图等已有具体类别；其余前馈重建选前馈重建，其余非前馈重建选三维重建。本表的三维重建标签用于补充归类，不重复覆盖已有重建类别。
      - 前馈重建和三维重建必须附带括号说明具体任务，分别填写“前馈重建（具体任务）”“三维重建（具体任务）”；括号内容简要说明具体任务即可。
    options:
      图像拼接: >-
        将有重叠的图像对齐并融合为更大视野或连续画面，主要关注配准、形变、接缝、矩形化或视频拼接稳定性；参考 APAP、UDIS2、StabStitch。
      前馈高斯: >-
        指前馈高斯重建任务，属于三维重建：由训练好的网络直接从输入图像等观测重建场景的高斯表示，服务于三维重建与新视角合成；参考 DepthSplat、AnySplat。
      优化高斯: >-
        指基于逐场景优化的高斯重建任务，属于三维重建：针对每个场景的观测迭代优化高斯表示，完成场景重建与新视角合成；参考标准 3DGS、DropGaussian。
      前馈点图: >-
        由网络直接预测像素对应的三维点图、点云或联合几何，核心产出是前馈三维几何；参考 Dust3R、VGGT。
      前馈重建: >-
        除前馈高斯重建、前馈点图重建之外的其他前馈重建任务，例如由网络直接从观测重建 NeRF 表示。
        填写时必须在括号中说明具体任务，例如“前馈重建（NeRF 重建）”。
      三维重建: >-
        除所有前馈重建任务和基于逐场景优化的高斯重建任务之外的其他三维重建任务，例如逐场景优化的 NeRF 重建、非前馈的 Mesh 重建、COLMAP 类摄影测量重建。
        填写时必须在括号中说明具体任务，例如“三维重建（NeRF 重建）”“三维重建（Mesh 重建）”“三维重建（SfM 重建）”。
      深度估计: >-
        主要任务是估计或补全深度图，并以深度准确性、泛化性或一致性作为核心评价；参考 DepthAnything、SurroundNEXO、R3D3。
      BEV: >-
        主要研究鸟瞰视角特征、地图或基于 BEV 的感知，核心产出不是三维体素占据；参考 BEVFormer。
      Occ: >-
        主要预测三维空间的占用、空闲或语义占据，表示可以是体素、隐式场或高斯；参考 SurroundOcc、GaussianFormer、Gausstr。
      SLAM: >-
        主要研究传感器定位、轨迹估计与地图构建的联合系统，包括视觉 SLAM 和高斯 SLAM；参考 ORB-SLAM。
      语义分割: >-
        以分割本身为主要目标的纯分割任务；按本表的科研分类习惯，涵盖语义分割、实例分割和开放词汇语义分割。
        若分割只是重建、占据预测等任务中的辅助模块，仍按论文的主要任务归类。
      相机标定: >-
        以求解或校正相机参数为主要目标的纯标定任务，包括内参、畸变参数、外参和多相机之间的标定。
        重建或 SLAM 中附带估计相机参数、位姿，不因此改归相机标定。
      其他: >-
        主要任务明确但不属于上述领域时，填写“其他（领域）”，括号中的领域概括不超过 5 个字。

  sensors:
    column: 输入配置
    selection: multiple
    notes:
      - 标注方法的实际输入，多个独立输入模态可以并列；训练用深度真值或 LiDAR 真值不自动构成 RGB-D 或 Lidar 输入。
      - 相机数量、视角布局与镜头类型分别判断；一个相机的连续多帧不因帧数多就变成多目。
      - 环视优先于笼统的多目；鱼眼阵列可按论文明确的配置并列鱼眼与环视，全景图不等同于多相机环视。
    options:
      "单目/双目/多目/环视": >-
        同属相机输入配置：单目使用一个相机，双目使用成对相机，多目使用多个视角相机。
        环视指围绕载体、朝向不同周向布置的多相机配置，nuScenes 是代表性配置。
        环视不要求完整覆盖水平 360°；Waymo 这类覆盖水平周向大半区域、相机布局符合环视配置的情况也归为环视。
        通常是针孔或轻度广角成像；按本文实际采用的配置选取，多个独立实验设置可以多选。
      鱼眼: >-
        输入包含一个或多个鱼眼相机的图像，方法或实验明确处理鱼眼投影及其大视场特征。
      全景: >-
        直接输入水平 360°、竖直 180° 的完整球面全景图；仅有一圈相机、宽幅拼接图或全景输出目标均不足以标注。
      RGB-D: >-
        推理时同时输入 RGB 图像与对应深度测量；仅由 RGB 预测深度或仅在训练时使用深度监督不属于此类。
      "Lidar/radar": >-
        同属主动测距输入：Lidar 指激光雷达点云或距离测量，radar 指毫米波等雷达观测；按实际输入分别选择，可同时选择。
      高精地图: >-
        方法以已有的高精地图作为外部输入或先验；这是输入信息源标签，仅生成地图或用地图评测时不选。
      其他: >-
        输入设备或信息源明确但未列出时，填写“其他（名称）”；多个名称用“、”分隔，每个名称不超过 3 个字。

  platforms:
    column: 平台
    selection: multiple
    notes:
      - 按真实采集载体、明确的部署对象或实验平台判断，不从某个算法理论上可部署的平台推断标签。
      - 通用用于明确面向一般输入且无特定平台约束的方法；已有具体平台时优先列具体平台，信息不足则写未说明。
    options:
      通用: 面向一般数据或任意采集载体，研究任务不绑定特定平台。
      车载: 面向正常乘用车或道路车辆的采集与感知平台；特指铰接拖挂结构时优先选拖挂车。
      拖挂车: 面向牵引车与挂车等多节铰接组成的车辆平台，结构或视角配置与该平台有关。
      无人机: 使用无人驾驶飞行器采集数据，或针对其机载感知、定位与重建开展研究。
      卫星: 使用卫星平台的遥感观测，或针对星载数据开展研究。
      手持相机: 由人手持的相机或手机采集，论文明确使用或面向该类采集方式。
      轮式机器人: 使用或面向轮式移动机器人，如移动底盘、配送机器人等；正常乘用车选车载，以机械臂为主体的移动操作平台选机械臂。
      四足机器人: 使用或面向四足移动机器人，如机器狗，研究围绕其感知、定位或重建等任务开展。
      人形机器人: >-
        使用或面向完整的人形机器人平台；仅有单臂、双臂或机械臂搭配移动底座的平台均不属于此类。
      机械臂: >-
        主体为机械臂、但不是完整人形机器人的各类平台，包括单臂、双臂、固定机械臂以及安装在轮式底座上的移动机械臂。
        以机械臂为主体的平台选此标签，不因装有轮式底座就重复标注轮式机器人。
      其他: >-
        平台明确但未列出时，填写“其他（名称）”；多个名称用“、”分隔，每个名称不超过 3 个字。

  scenarios:
    column: 场景
    selection: multiple
    notes:
      - 按本文实际研究或验证的环境判断，场景与平台分别选择，例如无人机平台不自动代表所有实验都是航拍场景。
      - 驾驶、越野、航拍等具体场景优先于笼统的室外；不同实验确实覆盖多个场景时可以多选。
      - 通用表示明确跨环境且不限定特定场景，不能作为不清楚场景的占位值。
    options:
      "室内/室外/通用": >-
        同属一般环境范围：室内是建筑内部等环境，室外是未限定为驾驶、越野或航拍的一般户外环境，通用是不绑定特定环境的通用场景研究。
        明确分别验证室内和室外时可以同时选择二者，无需再重复添加通用。
      驾驶: 城市道路等正常乘用车驾驶环境，主要围绕道路、车辆、行人及交通设施开展研究。
      越野: 非铺装道路、野外地形等越野环境，研究涉及相应的地形、可通行性或环境感知特点。
      航拍: 从空中或更高处俯视地表的场景，包括无人机航拍和卫星遥感。
      "夜间/雨雪/大雾": >-
        同属特殊光照或天气场景：夜间指夜晚或低照度环境，雨雪指降雨或降雪环境，大雾指浓雾造成能见度下降的环境。
        只有论文专门研究这些条件下的重建、感知、定位等算法时，才选择对应标签；不能仅因数据集包含此类数据或常规评测覆盖这些样本就添加。
        可与驾驶、越野、室外等环境标签并列，例如驾驶、夜间。

  technical:
    column: 技术特征
    selection: optional_multiple
    allow_custom: true
    notes:
      - 这里填写方法的技术特征标签，不要求填满；优先使用下列选项，确有未覆盖特征时可补充简短、具体且有原文依据的标签。
      - 同一组共享解释，但不代表各标签互为同义词或必须一起选择；逐个判断是否适用。
      - 信息足够但没有适用标签时填“—”；尚未核实技术信息时填“未说明”。
      - 避免堆叠高精度、高效率、先进等宣传性词语；实时等性能标签需要明确的测量条件与结果支撑。
    options:
      "目标检测/目标跟踪/点跟踪": >-
        描述本文实际承担的感知子任务：目标检测定位并识别对象，目标跟踪关联对象轨迹，点跟踪追踪像素或三维点的对应关系。
        仅作为无关基线或背景提及时不选。
      光流: 估计图像帧之间像素的二维位移或运动对应关系；作为本文研究任务或方法中的实际模块时可选。
      扩散模型: 扩散或去噪生成过程是本文方法的实际组成部分，而非仅出现在对比方法中。
      "无需训练/即插即用": >-
        描述使用与集成方式：无需训练指所讨论的方法阶段不需要新增训练，并不表示所有依赖模型从未训练；
        即插即用指模块可直接接入已有流程且无需大幅改造，不能仅因无需训练就同时选取。
      "自监督/弱监督/半监督": >-
        描述训练监督来源：自监督从数据自身构造监督，弱监督使用较粗粒度、不完整或有噪声的监督，半监督联合使用有标注与无标注数据。
        根据实际训练目标与标签来源选择，而非仅凭标注量少判断。
      开放词汇: 方法支持训练时未封闭枚举的类别或自然语言查询，通常通过语言与视觉对齐实现；固定类别分类不属于此类。
      大规模预训练: 大规模数据预训练是本文核心方法或实验的重要环节；仅调用一个现成预训练骨干不足以自动添加。
      "多任务/预迁移": >-
        描述任务组织与知识迁移：多任务指联合学习或执行多个目标任务；预迁移沿用本标签名，指将预训练模型或已有任务知识迁移、适配到目标任务或领域。
        根据本文实际研究内容选择，使用预训练权重本身不足以说明研究了迁移。
      "单帧/多帧/视频序列": >-
        描述时间输入：单帧使用一个时刻的观测，可包含同步的环视多相机图像；多帧联合使用多个时刻的观测；视频序列以连续视频为输入并利用其时序信息。
        按论文实际采用的输入方式选择，不把同一时刻的多目图像等同于多帧。
      "尺度恢复/几何一致性/可见性建模/自由空间约束": >-
        同属几何能力：尺度恢复确定或校正重建几何的尺度，尤其是真实尺度；几何一致性约束不同视角、时刻或表示之间的三维几何关系；
        可见性建模描述哪些区域可观测、被遮挡或相互遮挡；自由空间约束利用观测确定未被物体占据的空间，并据此约束几何或占据预测。
        根据本文实际使用或重点研究的几何能力选取，可多选。
      "流式/增量/动态/静态": >-
        描述时间处理与场景假设：流式按数据到达顺序持续处理，增量在已有状态或地图上追加更新，动态明确建模运动或变化，静态以不随时间变化的场景为假设。
        这些属性可交叉，但流式或增量不自动意味着支持动态场景。
      "稀疏/稠密": >-
        描述论文明确强调的观测、表示或预测密度，例如稀疏视图输入、稠密点图输出；须能在原文中确定所指对象。
        本文同时研究稀疏输入与稠密输出时可同时选择，不能把稀疏和稠密视为无条件互斥。
      无需位姿: >-
        推理输入不要求已知相机位姿，允许方法内部估计位姿；仅在训练中使用位姿监督不排除此标签。
        若主要结果依赖给定位姿，则不能因附加实验支持未知位姿而笼统标注。
